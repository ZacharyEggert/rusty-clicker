[package]
name = "rusty-clicker-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rusty-clicker"
path = "src/main.rs"

[dependencies]
rusty-clicker-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
anyhow = "1"
rand = "0.8"
